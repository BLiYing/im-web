# 打包配置。D2 只求「mac 出一个未签名包」，签名 / 公证 / 自动更新归 D6。
appId: com.libeyond.imdesktop
productName: IM Desktop
directories:
  output: release
  buildResources: resources
# 页面来自仓库根的 dist/（vite build 的产物）——桌面端与浏览器版共用同一份源码，
# 这里是那句话在打包环节的落点：不复制源码，只复制构建产物。
files:
  - out/**/*
  - package.json
  # 页面本体：仓库根 `npm run build` 的产物。**不复制源码，只复制构建产物**——
  # 「桌面端与浏览器版共用一份源码」这句话在打包环节的落点就是这三行。
  - from: ../dist
    to: dist
    filter:
      - "**/*"
# 托盘图标要随包走：主进程用 process.resourcesPath 直接拼文件名（见 tray.ts）。
# **必须写 from/to 压平**：只写路径的话 electron-builder 会保留目录层级，
# 文件落到 Contents/Resources/**resources**/tray.png，而代码找的是 Contents/Resources/tray.png
# ——2026-09-08 首次打包就踩了，是 `--shell-check` 在打包版上抓出来的（dev 模式走的是另一条路径，验不到）。
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  - from: resources/trayTemplate.png     # macOS 菜单栏单色模板图（见 tray.ts trayIconPath）
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
extraMetadata:
  main: out/main/index.js
asar: true
# 深链 imdesktop://（只收邀请码，见 src/main/deepLink.ts）。macOS 靠这里写进 Info.plist 的
# CFBundleURLTypes——运行时的 setAsDefaultProtocolClient 在 mac 上也要 Info.plist 先声明过才生效。
protocols:
  - name: IM Desktop
    schemes:
      - imdesktop
mac:
  icon: resources/icon.png
  category: public.app-category.social-networking
  target:
    # 发给别人用 zip（公证后的 .app 压进去，票据已钉在 App 里，对方解压即可打开）；
    # dmg 要背景图 / 布局，属 D6 剩余。只要 .app 目录自测时用 `npm run pack`（--dir 会忽略这里的 target）。
    - zip
  # 2026-10-02 起用 Developer ID 证书签名（原 identity: null 未签名 → macOS 不登记通知、桌面通知弹不出）。
  # 证书在打包机钥匙串里；不加「Developer ID Application:」前缀，electron-builder 自己按类型找。
  identity: "CSC 41 PARTICIPACOES LTDA. (G247R2HSZ7)"
  hardenedRuntime: true          # 公证的前提（默认即 true，写明是为了不被误关）
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # 公证：不写 notarize，electron-builder 在环境变量齐了时自动做——
  #   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID（只放环境变量，绝不进仓库）。
  # 没设就只签名不公证：本机自用够了，发给别人装要先公证（否则 Gatekeeper 拦「无法验证开发者」）。
  extendInfo:
    NSMicrophoneUsageDescription: 用于录制语音消息和语音/视频通话。
    NSCameraUsageDescription: 用于视频通话。
extraFiles: []
